<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ form_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1B2A4A',
                        accent: '#F59E0B',
                        success: '#10B981',
                        bgLight: '#F8FAFC'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-bgLight h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h2 class="text-3xl font-bold text-primary mb-3 text-center">{{ form_title }}</h2>
        <p class="text-slate-500 mb-8 text-center text-sm">{{ form_description }}</p>

        <form id="leadForm" class="space-y-5" onsubmit="submitForm(event)">
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1" for="name">Ваше имя</label>
                <input type="text" id="name" name="name" required
                    class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition"
                    placeholder="Иван Иванов">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1" for="email">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition"
                    placeholder="example@mail.com">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1" for="phone">Телефон</label>
                <input type="tel" id="phone" name="phone" required
                    class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition"
                    placeholder="+7 (999) 000-00-00">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-accent hover:bg-yellow-600 text-white font-bold py-4 rounded-xl transition shadow-md flex justify-center items-center">
                <span>Отправить заявку</span>
            </button>

            <!-- Сообщения об успехе / ошибке -->
            <div id="successMsg" class="hidden text-success text-center font-semibold bg-emerald-50 p-3 rounded-lg">
                ✅ Заявка успешно отправлена!
            </div>
            <div id="errorMsg" class="hidden text-red-500 text-center font-semibold bg-red-50 p-3 rounded-lg">
                ❌ Произошла ошибка. Попробуйте снова.
            </div>

            <p class="text-xs text-slate-400 text-center mt-4">
                Нажимая кнопку, вы принимаете условия <br>
                <a href="{{ privacy_policy_url }}" class="underline hover:text-primary transition" target="_blank">Политики конфиденциальности</a>.
            </p>
        </form>
    </div>

    <script>
        async function submitForm(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');
            
            // Сброс состояний
            btn.disabled = true;
            btn.innerHTML = 'Отправка...';
            successMsg.classList.add('hidden');
            errorMsg.classList.add('hidden');

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value
            };

            try {
                const response = await fetch('{{ submit_url }}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    document.getElementById('leadForm').reset();
                    successMsg.classList.remove('hidden');
                } else {
                    throw new Error('Server error');
                }
            } catch (error) {
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Отправить заявку</span>';
            }
        }
    </script>
</body>
</html>
